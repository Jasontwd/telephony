# Existing Fly app supplied by Formtech.
app = "telephony-kidzwq"
primary_region = "syd"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_BASE_URL = "https://telephony-kidzwq.fly.dev"
  PUBLIC_PHONE = "+6498700642"
  NODE_ENV = "production"
  PORT = "8080"
  DB_PATH = "/data/formtech.sqlite"

[[mounts]]
  source = "formtech_data_v2"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
